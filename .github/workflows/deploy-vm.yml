name: Desplegar en VM (asorapa.sytes.net)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo del deploy manual"
        required: false
        default: "deploy manual"

concurrency:
  group: deploy-vm
  cancel-in-progress: true

jobs:
  validate:
    name: Validar protocolo eQSO
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.26.1"

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Comprobar liberación PTT de eQSO 1.13
        run: pnpm --filter @workspace/api-server run test

      - name: Comprobar tipos del servidor
        run: pnpm --filter @workspace/api-server run typecheck

  deploy:
    name: Actualizar VM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate

    steps:
      - name: Conectar a la VM y ejecutar update.sh
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_SSH_HOST }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 9m
          script: |
            export GITHUB_SHA="${{ github.sha }}"
            export GITHUB_REF="${{ github.ref_name }}"
            bash /opt/eqso-asorapa/artifacts/api-server/install/update.sh

      - name: Resultado
        if: success()
        run: |
          echo "✅ Deploy completado"
          echo "   Commit : ${{ github.sha }}"
          echo "   Rama   : ${{ github.ref_name }}"
          echo "   Autor  : ${{ github.actor }}"
