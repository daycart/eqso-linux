openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bulletins
    description: Weather bulletin operations for administrators
  - name: relay-tokens
    description: Administrator-managed relay credentials
paths:
  /admin/bulletins/schedule:
    get:
      operationId: getBulletinSchedule
      tags: [bulletins]
      responses:
        "200":
          description: Configuration and scheduler status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulletinScheduleStatus"
    put:
      operationId: updateBulletinSchedule
      tags: [bulletins]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulletinScheduleInput"
      responses:
        "200":
          description: Saved configuration and scheduler status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulletinScheduleStatus"
        "400":
          description: Invalid configuration or missing RF confirmation
        "503":
          description: Scheduler unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /admin/relay-tokens:
    get:
      operationId: listRelayTokens
      tags: [relay-tokens]
      summary: List relay tokens without secrets
      responses:
        "200":
          description: Token metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RelayTokenInfo"
    post:
      operationId: createRelayToken
      tags: [relay-tokens]
      summary: Create a token shown only once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelayTokenInput"
      responses:
        "201":
          description: New token, shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayTokenCreated"
        "400":
          description: Invalid input
  /admin/relay-tokens/{id}/revoke:
    post:
      operationId: revokeRelayToken
      tags: [relay-tokens]
      summary: Revoke a token and disconnect its current sessions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayTokenRevoked"
        "404":
          description: Already revoked or missing
  /admin/bulletins/status:
    get:
      operationId: getBulletinStatus
      tags: [bulletins]
      summary: Get weather bulletin status
      responses:
        "200":
          description: Current bulletin generation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulletinStatus"
  /admin/bulletins/current:
    get:
      operationId: getCurrentBulletin
      tags: [bulletins]
      summary: Get the current weather bulletin
      responses:
        "200":
          description: Current bulletin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherBulletin"
        "404":
          description: No bulletin has been generated
  /admin/bulletins/history:
    get:
      operationId: listBulletinHistory
      tags: [bulletins]
      summary: List generated weather bulletins
      responses:
        "200":
          description: Generated bulletin history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeatherBulletin"
  /admin/bulletins/rooms:
    get:
      operationId: listBulletinTransmissionRooms
      tags: [bulletins]
      summary: List rooms eligible for manual bulletin transmission
      responses:
        "200":
          description: Eligible eQSO rooms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulletinTransmissionRooms"
  /admin/bulletins/transmissions:
    get:
      operationId: listBulletinTransmissions
      tags: [bulletins]
      summary: List recent bulletin transmission attempts
      responses:
        "200":
          description: Recent transmission history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BulletinTransmission"
  /admin/bulletins/{id}/transmit:
    post:
      operationId: transmitBulletin
      tags: [bulletins]
      summary: Manually transmit an existing bulletin to one room
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulletinTransmissionInput"
      responses:
        "200":
          description: Transmission completed or failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulletinTransmission"
        "400":
          description: Invalid bulletin, room, or confirmation
        "404":
          description: Bulletin not found
        "409":
          description: Room is already transmitting
        "502":
          description: Audio conversion or transmission failure
  /admin/bulletins/generate:
    post:
      operationId: generateBulletin
      tags: [bulletins]
      summary: Generate a weather bulletin manually
      responses:
        "201":
          description: Generated weather bulletin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherBulletin"
        "502":
          description: AEMET or audio integration failure
  /admin/bulletins/{id}/audio:
    get:
      operationId: getBulletinAudio
      tags: [bulletins]
      summary: Download generated bulletin audio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Bulletin audio in WAV format
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        "404":
          description: Audio or bulletin not found
components:
  schemas:
    BulletinScheduleInput:
      type: object
      additionalProperties: false
      required: [generationEnabled, transmissionEnabled, generationIntervalMinutes, transmissionIntervalMinutes, maxAgeMinutes, room]
      properties:
        generationEnabled: { type: boolean }
        transmissionEnabled: { type: boolean }
        generationIntervalMinutes: { type: integer, minimum: 15, maximum: 10080 }
        transmissionIntervalMinutes: { type: integer, minimum: 5, maximum: 10080 }
        maxAgeMinutes: { type: integer, minimum: 15, maximum: 10080 }
        room: { type: string, maxLength: 100 }
        confirmed: { type: boolean }
    BulletinScheduleEvent:
      type: object
      required: [at, status, message]
      properties:
        at: { type: string, format: date-time }
        status: { type: string, enum: [completed, failed, skipped] }
        message: { type: string }
    BulletinScheduleStatus:
      type: object
      required: [config, nextGenerationAt, nextTransmissionAt, generationRunning, transmissionRunning, lastGeneration, lastTransmission]
      properties:
        config:
          $ref: "#/components/schemas/BulletinScheduleInput"
        nextGenerationAt: { type: [string, "null"], format: date-time }
        nextTransmissionAt: { type: [string, "null"], format: date-time }
        generationRunning: { type: boolean }
        transmissionRunning: { type: boolean }
        lastGeneration:
          anyOf:
            - $ref: "#/components/schemas/BulletinScheduleEvent"
            - type: "null"
        lastTransmission:
          anyOf:
            - $ref: "#/components/schemas/BulletinScheduleEvent"
            - type: "null"
    RelayTokenInfo:
      type: object
      required: [id, callsign, label, legacyDisabled, createdAt, lastUsedAt, revokedAt]
      properties:
        id: { type: integer }
        callsign: { type: string }
        label: { type: string }
        legacyDisabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: ["string", "null"], format: date-time }
        revokedAt: { type: ["string", "null"], format: date-time }
    RelayTokenCreated:
      type: object
      required: [id, callsign, label, token, legacyDisabled, createdAt, lastUsedAt, revokedAt]
      properties:
        id: { type: integer }
        callsign: { type: string }
        label: { type: string }
        token: { type: string }
        legacyDisabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: ["string", "null"], format: date-time }
        revokedAt: { type: ["string", "null"], format: date-time }
    RelayTokenInput:
      type: object
      required: [callsign, label]
      properties:
        callsign: { type: string, minLength: 4, maxLength: 30 }
        label: { type: string, minLength: 1, maxLength: 100 }
    RelayTokenRevoked:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WeatherBulletin:
      type: object
      properties:
        id:
          type: string
          format: uuid
        identity:
          type: string
        geographicFocus:
          type: string
        municipality:
          type: string
        forecastText:
          type: string
        sourceUrl:
          type: string
          format: uri
        sourceAttribution:
          type: string
        sourcePublishedAt:
          type: ["string", "null"]
        sourceRetrievedAt:
          type: string
          format: date-time
        generatedAt:
          type: string
          format: date-time
        audioFileName:
          type: string
        audioMimeType:
          type: string
        audioUrl:
          type: string
        forecastDates:
          type: array
          items:
            type: string
            format: date
      required:
        - id
        - identity
        - geographicFocus
        - municipality
        - forecastText
        - sourceUrl
        - sourceAttribution
        - sourcePublishedAt
        - sourceRetrievedAt
        - generatedAt
        - audioFileName
        - audioMimeType
        - audioUrl
        - forecastDates
    BulletinStatus:
      type: object
      properties:
        identity:
          type: string
        geographicFocus:
          type: string
        sourceUrl:
          type: string
          format: uri
        historyCount:
          type: integer
        hasCurrent:
          type: boolean
        currentId:
          type: ["string", "null"]
        currentGeneratedAt:
          type: ["string", "null"]
      required:
        - identity
        - geographicFocus
        - sourceUrl
        - historyCount
        - hasCurrent
        - currentId
        - currentGeneratedAt
    BulletinTransmissionRooms:
      type: object
      properties:
        rooms:
          type: array
          items:
            type: string
      required:
        - rooms
    BulletinTransmissionInput:
      type: object
      properties:
        room:
          type: string
          minLength: 1
        confirmed:
          type: boolean
          const: true
      required:
        - room
        - confirmed
    BulletinTransmission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bulletinId:
          type: string
          format: uuid
        bulletinGeneratedAt:
          type: string
          format: date-time
        room:
          type: string
        requestedAt:
          type: string
          format: date-time
        startedAt:
          type: ["string", "null"]
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
        status:
          type: string
          enum: [completed, failed, rejected]
        error:
          type: ["string", "null"]
        packetCount:
          type: integer
        durationMs:
          type: integer
        requestedBy:
          type: ["string", "null"]
      required:
        - id
        - bulletinId
        - bulletinGeneratedAt
        - room
        - requestedAt
        - startedAt
        - completedAt
        - status
        - error
        - packetCount
        - durationMs
        - requestedBy

